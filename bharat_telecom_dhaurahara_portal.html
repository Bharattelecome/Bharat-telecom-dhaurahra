<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>भारत टेलीकॉम धौरहरा | मैनेजमेंट पोर्टल</title>
<style>
:root{--navy:#071b49;--blue:#123b8a;--gold:#ffd43b;--red:#b90f2b;--bg:#f3f6fc;--ink:#17233d;--muted:#64718b;--line:#e1e7f2;--green:#16845b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:white;font-weight:700}button.secondary{background:#e8eefb;color:var(--blue)}button.danger{background:#a9152b}input,select{width:100%;padding:11px 12px;border:1px solid #d5ddec;border-radius:10px;background:white;color:var(--ink)}label{display:block;font-size:13px;font-weight:700;margin:0 0 6px;color:#43516b}.field{margin-bottom:13px}.muted{color:var(--muted)}.small{font-size:12px}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#2358b4,transparent 45%),linear-gradient(135deg,#06143a,#0b2d72 65%,#a10d28)}
.login-card{width:min(100%,460px);background:white;border-radius:24px;padding:30px;box-shadow:0 25px 80px #0005}.brandmark{width:58px;height:58px;display:grid;place-items:center;background:var(--gold);color:#092254;border-radius:16px;font-size:28px;font-weight:900;margin-bottom:14px}.login-card h1{margin:0;font-size:28px;color:var(--navy)}.login-card .subtitle{margin:5px 0 22px;color:var(--muted)}.demo{background:#fff8d9;border:1px solid #f3df83;border-radius:12px;padding:12px;font-size:13px;margin-top:14px;line-height:1.7}
.app{min-height:100vh}.topbar{background:var(--navy);color:white;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:4px solid var(--gold)}.brand{font-size:20px;font-weight:900}.brand span{color:var(--gold)}.top-right{display:flex;align-items:center;gap:12px;font-size:13px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 70px)}.sidebar{background:white;border-right:1px solid var(--line);padding:18px 12px}.navbtn{display:flex;width:100%;text-align:left;gap:10px;align-items:center;margin:4px 0;background:transparent;color:#43516b;padding:12px;border-radius:11px}.navbtn.active,.navbtn:hover{background:#eaf0ff;color:var(--blue)}.content{padding:24px;min-width:0}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.pagehead h2{margin:0;font-size:25px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 3px 14px #0c2b6610}.stat .label{font-size:13px;color:var(--muted)}.stat .num{font-size:27px;font-weight:900;margin-top:6px;color:var(--navy)}.stat .emoji{float:right;font-size:24px}.panel{margin-bottom:16px}.panel h3{margin:0 0 14px;font-size:17px}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line)}th{background:#f5f7fc;color:#53617b;font-weight:800}td .action{padding:6px 9px;font-size:12px}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#e8f8f0;color:#11734e;font-size:11px;font-weight:800}.badge.warn{background:#fff3d4;color:#8a5b00}.badge.red{background:#ffe7ea;color:#a9152b}.notice{background:#edf4ff;border:1px solid #cfdefb;padding:12px;border-radius:12px;font-size:13px;line-height:1.6}.result{font-size:24px;font-weight:900;color:var(--green);margin:6px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;padding:25px;color:var(--muted)}.mobile-menu{display:none}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;gap:4px;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.navbtn{white-space:nowrap;width:auto;margin:0}.content{padding:15px}.row3{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid{gap:9px}.stat{padding:13px}.stat .num{font-size:21px}.row,.row3{grid-template-columns:1fr}.topbar{padding:12px 15px}.brand{font-size:17px}.pagehead h2{font-size:21px}.login-card{padding:22px}}
</style>
</head>
<body>
<section id="loginScreen" class="login-wrap">
 <div class="login-card">
  <div class="brandmark">भा</div><h1>भारत टेलीकॉम</h1><div class="subtitle">धौरहरा, खीरी • मोबाइल एवं फाइनेंस मैनेजमेंट</div>
  <form id="loginForm">
   <div class="field"><label for="username">यूज़र आईडी</label><input id="username" autocomplete="username" placeholder="admin या staff" required></div>
   <div class="field"><label for="password">पासवर्ड</label><input id="password" type="password" autocomplete="current-password" placeholder="डेमो पासवर्ड डालें" required></div>
   <button style="width:100%;padding:13px" type="submit">लॉगिन करें →</button>
   <div id="loginError" class="small" style="color:#b00020;margin-top:10px"></div>
  </form>
  <div class="demo"><b>डेमो लॉगिन</b><br>एडमिन: <b>admin</b> / <b>1234</b><br>कर्मचारी: <b>staff</b> / <b>1234</b><br><span class="muted">यह प्रदर्शन के लिए है; वास्तविक ग्राहक डेटा डालने से पहले सुरक्षित सर्वर-आधारित लॉगिन लगवाएँ।</span></div>
 </div>
</section>
<div id="app" class="app hidden">
<header class="topbar"><div class="brand">भारत <span>टेलीकॉम</span> धौरहरा</div><div class="top-right"><span id="userBadge">👤 Admin</span><button class="secondary" id="logoutBtn">लॉगआउट</button></div></header>
<div class="layout">
 <nav class="sidebar" id="nav">
  <button class="navbtn active" data-page="dashboard">🏠 डैशबोर्ड</button>
  <button class="navbtn" data-page="mobiles">📱 मोबाइल जानकारी</button>
  <button class="navbtn" data-page="emi">🧮 फाइनेंस / EMI</button>
  <button class="navbtn" data-page="customers">👥 ग्राहक व किस्तें</button>
  <button class="navbtn" data-page="stock">📦 स्टॉक</button>
  <button class="navbtn" data-page="sales">🧾 बिक्री रिकॉर्ड</button>
  <button class="navbtn admin-only" data-page="staff">🔐 कर्मचारी / सेटिंग</button>
 </nav>
 <main class="content" id="main"></main>
</div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const read=(k,d=[])=>{try{return JSON.parse(localStorage.getItem('bt_'+k))??d}catch{return d}};
const save=(k,v)=>localStorage.setItem('bt_'+k,JSON.stringify(v));
let role='admin',username='admin',page='dashboard';
let mobiles=read('mobiles',[
{id:1,brand:'Samsung',model:'Galaxy A-series',price:15999,ram:'8 GB',storage:'128 GB',stock:5},
{id:2,brand:'Apple',model:'iPhone (डेमो)',price:59999,ram:'—',storage:'128 GB',stock:2},
{id:3,brand:'Vivo',model:'V-series',price:18999,ram:'8 GB',storage:'128 GB',stock:4},
{id:4,brand:'OPPO',model:'A-series',price:13999,ram:'6 GB',storage:'128 GB',stock:6},
{id:5,brand:'Redmi',model:'Note-series',price:12999,ram:'6 GB',storage:'128 GB',stock:7}
]);
let customers=read('customers',[]);
let sales=read('sales',[]);
function persist(){save('mobiles',mobiles);save('customers',customers);save('sales',sales)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();let u=$('#username').value.trim().toLowerCase(),p=$('#password').value; if(p==='1234'&&(u==='admin'||u==='staff')){username=u;role=u;$('#loginError').textContent='';$('#loginScreen').classList.add('hidden');$('#app').classList.remove('hidden');$('#userBadge').textContent=(role==='admin'?'👑 एडमिन':'👤 कर्मचारी')+' • '+u;$$('.admin-only').forEach(b=>b.classList.toggle('hidden',role!=='admin'));render()}else $('#loginError').textContent='यूज़र आईडी या पासवर्ड सही नहीं है। डेमो के लिए admin/staff और 1234 इस्तेमाल करें।'});
$('#logoutBtn').onclick=()=>{$('#app').classList.add('hidden');$('#loginScreen').classList.remove('hidden');$('#password').value=''};
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;$$('.navbtn').forEach(x=>x.classList.toggle('active',x===b));render()});
function head(title,desc=''){return `<div class="pagehead"><div><h2>${title}</h2><div class="muted small">${desc}</div></div><div class="small muted">📍 सिनेमा हाल रोड, धौरहरा खीरी</div></div>`}
function stat(label,num,emoji){return `<div class="stat"><span class="emoji">${emoji}</span><div class="label">${label}</div><div class="num">${num}</div></div>`}
function render(){let m=$('#main');if(role!=='admin'&&page==='staff')page='dashboard';switch(page){case'dashboard':m.innerHTML=dashboard();break;case'mobiles':m.innerHTML=mobilePage();break;case'emi':m.innerHTML=emiPage();break;case'customers':m.innerHTML=customerPage();break;case'stock':m.innerHTML=stockPage();break;case'sales':m.innerHTML=salesPage();break;case'staff':m.innerHTML=staffPage();break}wirePage()}
function dashboard(){let stock=mobiles.reduce((a,x)=>a+(+x.stock||0),0),rev=sales.reduce((a,x)=>a+(+x.amount||0),0),due=customers.reduce((a,x)=>a+(+x.due||0),0);return head('डैशबोर्ड','दुकान की मुख्य जानकारी एक जगह')+`<div class="grid">${stat('मोबाइल मॉडल',mobiles.length,'📱')}${stat('कुल स्टॉक यूनिट',stock,'📦')}${stat('कुल दर्ज बिक्री',money(rev),'🧾')}${stat('ग्राहकों की बाकी किस्त',money(due),'💳')}</div><div class="panel"><h3>त्वरित काम</h3><div class="actions"><button data-go="mobiles">+ मोबाइल जोड़ें</button><button data-go="customers">+ ग्राहक / फाइनेंस जोड़ें</button><button data-go="sales">+ बिक्री दर्ज करें</button><button class="secondary" data-go="emi">EMI कैलकुलेटर खोलें</button></div></div><div class="panel"><h3>हाल की बिक्री</h3>${sales.length?table(['तारीख','ग्राहक','मोबाइल','राशि'],sales.slice(-5).reverse().map(s=>[esc(s.date),esc(s.customer),esc(s.model),money(s.amount)])):'<div class="empty">अभी कोई बिक्री दर्ज नहीं है।</div>'}<div class="notice">डेमो डेटा इसी ब्राउज़र में सेव होता है। यह अभी बैंक, NBFC, क्रेडिट ब्यूरो या किसी वास्तविक फाइनेंस कंपनी से जुड़ा नहीं है।</div></div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function mobilePage(){return head('मोबाइल की पूरी जानकारी','मॉडल, कीमत, RAM, स्टोरेज और स्टॉक')+`<div class="panel"><h3>मोबाइल जोड़ें</h3><form id="mobileForm"><div class="row3"><div class="field"><label>ब्रांड</label><input name="brand" required placeholder="जैसे Samsung"></div><div class="field"><label>मॉडल</label><input name="model" required placeholder="मॉडल नाम"></div><div class="field"><label>कीमत (₹)</label><input name="price" type="number" min="0" required></div><div class="field"><label>RAM</label><input name="ram" placeholder="8 GB"></div><div class="field"><label>स्टोरेज</label><input name="storage" placeholder="128 GB"></div><div class="field"><label>स्टॉक यूनिट</label><input name="stock" type="number" min="0" value="1" required></div></div><button>मोबाइल सेव करें</button></form></div><div class="panel"><h3>मोबाइल कैटलॉग</h3>${table(['ब्रांड','मॉडल','कीमत','RAM','स्टोरेज','स्टॉक','कार्य'],mobiles.map(x=>[esc(x.brand),esc(x.model),money(x.price),esc(x.ram),esc(x.storage),x.stock,`<button class="danger action" data-delete-mobile="${x.id}">हटाएँ</button>`]))}</div>`}
function emiPage(){return head('फाइनेंस एवं EMI कैलकुलेटर','अनुमानित किस्त निकालें; अंतिम शर्तें फाइनेंस कंपनी तय करेगी')+`<div class="panel"><h3>EMI की गणना</h3><div class="row"><div class="field"><label>मोबाइल की कीमत (₹)</label><input id="emiPrice" type="number" min="0" value="20000"></div><div class="field"><label>डाउन पेमेंट (₹)</label><input id="emiDown" type="number" min="0" value="4000"></div><div class="field"><label>वार्षिक ब्याज दर (%)</label><input id="emiRate" type="number" min="0" step=".1" value="15"></div><div class="field"><label>अवधि (महीने)</label><select id="emiMonths"><option>3</option><option>6</option><option selected>9</option><option>12</option><option>18</option><option>24</option><option>36</option></select></div></div><button id="calcEmi">EMI निकालें</button><div id="emiResult" class="notice" style="margin-top:15px">राशि भरकर EMI निकालें।</div></div><div class="panel"><h3>फाइनेंस के लिए जानकारी चेकलिस्ट</h3><ul><li>ग्राहक की पहचान व पता: केवल अधिकृत प्रक्रिया और सहमति से सत्यापित करें।</li><li>मोबाइल कीमत, डाउन पेमेंट, अवधि, ब्याज दर और सभी फीस स्पष्ट लिखें।</li><li>लागू होने पर फाइनेंस पार्टनर की स्वीकृति, KFS/समझौता और भुगतान शेड्यूल दें।</li><li>किस्त भुगतान की रसीद दें और बकाया रिकॉर्ड नियमित अपडेट करें।</li></ul><div class="notice">यह कैलकुलेटर केवल अनुमान देता है। प्रोसेसिंग फीस, बीमा, टैक्स, फ्लैट रेट, अग्रिम भुगतान या कंपनी के नियमों से वास्तविक EMI/कुल लागत बदल सकती है।</div></div>`}
function customerPage(){return head('ग्राहक एवं किस्त रिकॉर्ड','फाइनेंस ग्राहक जोड़ें और बकाया/किस्त भुगतान दर्ज करें')+`<div class="panel"><h3>नया ग्राहक / फाइनेंस रिकॉर्ड</h3><form id="customerForm"><div class="row3"><div class="field"><label>ग्राहक का नाम</label><input name="name" required></div><div class="field"><label>मोबाइल नंबर</label><input name="phone" required inputmode="numeric" pattern="[0-9+ -]{8,16}"></div><div class="field"><label>मोबाइल मॉडल</label><input name="model" required></div><div class="field"><label>कुल फाइनेंस राशि (₹)</label><input name="amount" type="number" min="0" required></div><div class="field"><label>बाकी किस्त / बकाया (₹)</label><input name="due" type="number" min="0" required></div><div class="field"><label>अगली किस्त तारीख</label><input name="next" type="date"></div></div><button>ग्राहक सेव करें</button></form></div><div class="panel"><h3>ग्राहक रिकॉर्ड</h3>${customers.length?table(['नाम','फोन','मॉडल','फाइनेंस राशि','बकाया','अगली तारीख','भुगतान'],customers.map(c=>[esc(c.name),esc(c.phone),esc(c.model),money(c.amount),`<b>${money(c.due)}</b>`,esc(c.next||'—'),`<button class="action" data-pay="${c.id}">किस्त दर्ज करें</button> <button class="danger action" data-delete-customer="${c.id}">हटाएँ</button>`])):'<div class="empty">अभी ग्राहक रिकॉर्ड नहीं है।</div>'}</div>`}
function stockPage(){return head('स्टॉक प्रबंधन','मौजूदा मॉडल और उपलब्ध यूनिट')+`<div class="panel"><h3>स्टॉक सारांश</h3>${table(['ब्रांड','मॉडल','उपलब्ध यूनिट','स्थिति'],mobiles.map(x=>[esc(x.brand),esc(x.model),x.stock,(+x.stock<=2?'<span class="badge warn">कम स्टॉक</span>':'<span class="badge">उपलब्ध</span>')]))}<p class="muted small">स्टॉक बदलने के लिए “मोबाइल जानकारी” में मॉडल जोड़ें या बिक्री दर्ज करें।</p></div>`}
function salesPage(){return head('बिक्री रिकॉर्ड','बिक्री दर्ज करने पर स्टॉक अपने आप घटेगा')+`<div class="panel"><h3>नई बिक्री</h3><form id="saleForm"><div class="row3"><div class="field"><label>ग्राहक का नाम</label><input name="customer" required></div><div class="field"><label>मोबाइल</label><select name="mobile" required>${mobiles.map(x=>`<option value="${x.id}">${esc(x.brand+' '+x.model)} — ${money(x.price)} (स्टॉक ${x.stock})</option>`).join('')}</select></div><div class="field"><label>बिक्री राशि (₹)</label><input name="amount" type="number" min="0" required></div><div class="field"><label>तारीख</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>भुगतान का प्रकार</label><select name="method"><option>कैश</option><option>UPI</option><option>कार्ड</option><option>फाइनेंस</option></select></div></div><button>बिक्री सेव करें</button></form></div><div class="panel"><h3>बिक्री हिस्ट्री</h3>${sales.length?table(['तारीख','ग्राहक','मोबाइल','राशि','भुगतान'],sales.slice().reverse().map(s=>[esc(s.date),esc(s.customer),esc(s.model),money(s.amount),esc(s.method)])):'<div class="empty">अभी बिक्री दर्ज नहीं है।</div>'}</div>`}
function staffPage(){return head('एडमिन एवं कर्मचारी','डेमो रोल नियंत्रण और दुकान की जानकारी')+`<div class="panel"><h3>यूज़र भूमिकाएँ</h3>${table(['यूज़र आईडी','भूमिका','डेमो पासवर्ड','अनुमति'],[['admin','एडमिन','1234','सभी सेक्शन'],['staff','कर्मचारी','1234','डैशबोर्ड, मोबाइल, EMI, ग्राहक, स्टॉक, बिक्री']])}<div class="notice">सुरक्षा सूचना: यह केवल फ्रंटएंड डेमो है। यहाँ पासवर्ड वास्तविक सुरक्षा नहीं देते; डेटा ब्राउज़र में रहता है। लाइव उपयोग के लिए सर्वर, सुरक्षित पासवर्ड हैशिंग, अलग-अलग यूज़र अकाउंट, बैकअप, अनुमति नियंत्रण और ऑडिट लॉग आवश्यक हैं।</div><div class="field" style="margin-top:14px"><label>दुकान का संपर्क</label><input value="9415175825 • सिनेमा हाल रोड, धौरहरा खीरी" readonly></div></div>`}
function wirePage(){
$$('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;$$('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.page===page));render()});
let mf=$('#mobileForm');if(mf)mf.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(mf));mobiles.push({id:Date.now(),brand:d.brand,model:d.model,price:+d.price,ram:d.ram||'—',storage:d.storage||'—',stock:+d.stock});persist();render()};
$$('[data-delete-mobile]').forEach(b=>b.onclick=()=>{if(role!=='admin')return alert('केवल एडमिन मोबाइल रिकॉर्ड हटा सकता है।');if(confirm('इस मोबाइल मॉडल को हटाएँ?')){mobiles=mobiles.filter(x=>x.id!==+b.dataset.deleteMobile);persist();render()}});
let cf=$('#customerForm');if(cf)cf.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(cf));customers.push({id:Date.now(),...d,amount:+d.amount,due:+d.due});persist();render()};
$$('[data-delete-customer]').forEach(b=>b.onclick=()=>{if(role!=='admin')return alert('केवल एडमिन रिकॉर्ड हटा सकता है।');if(confirm('ग्राहक रिकॉर्ड हटाएँ?')){customers=customers.filter(x=>x.id!==+b.dataset.deleteCustomer);persist();render()}});
$$('[data-pay]').forEach(b=>b.onclick=()=>{let c=customers.find(x=>x.id===+b.dataset.pay);let n=prompt(`${c.name} की किस्त कितनी जमा हुई? (₹)`);if(n===null)return;let amt=Number(n);if(!Number.isFinite(amt)||amt<=0)return alert('सही रकम डालें।');c.due=Math.max(0,c.due-amt);c.lastPayment={amount:amt,date:new Date().toISOString().slice(0,10)};persist();alert('डेमो रिकॉर्ड में भुगतान दर्ज हुआ: '+money(amt));render()});
let sf=$('#saleForm');if(sf)sf.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(sf)),phone=mobiles.find(x=>x.id===+d.mobile);if(!phone||phone.stock<1)return alert('इस मॉडल का स्टॉक उपलब्ध नहीं है।');phone.stock--;sales.push({id:Date.now(),customer:d.customer,model:phone.brand+' '+phone.model,amount:+d.amount,date:d.date,method:d.method});persist();render()};
let calc=$('#calcEmi');if(calc)calc.onclick=()=>{let price=Math.max(0,+$('#emiPrice').value||0),down=Math.max(0,+$('#emiDown').value||0),annual=Math.max(0,+$('#emiRate').value||0),n=+$ ('#emiMonths').value;};
if(calc)calc.onclick=()=>{let price=Math.max(0,+$('#emiPrice').value||0),down=Math.max(0,+$('#emiDown').value||0),annual=Math.max(0,+$('#emiRate').value||0),n=+$('#emiMonths').value,principal=Math.max(0,price-down),r=annual/1200,emi=r===0?principal/n:principal*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1),total=emi*n;$('#emiResult').innerHTML=`<div>फाइनेंस राशि: <b>${money(principal)}</b></div><div class="result">${money(emi)} / माह</div><div>कुल अनुमानित किस्तें: <b>${money(total)}</b></div><div>कुल ब्याज: <b>${money(Math.max(0,total-principal))}</b></div><div class="small muted">अनुमान; अतिरिक्त शुल्क शामिल नहीं हैं।</div>`}
}
render();
</script>
</body>
</html>
