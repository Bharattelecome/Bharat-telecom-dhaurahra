<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bharat Telecom Dhaurahara</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#f1f4f8;color:#222}header{background:#073b75;color:white;text-align:center;padding:18px}header h1{margin:0 0 8px}button{border:0;border-radius:7px;padding:10px 12px;background:#073b75;color:white;font:inherit;cursor:pointer}#lang{background:#ffcc00;color:#222;font-weight:bold}nav{display:flex;gap:6px;padding:10px;background:white;overflow:auto;position:sticky;top:0}nav button{white-space:nowrap;font-size:14px}nav .active{background:#ffcc00;color:#222}main{max-width:950px;margin:auto;padding:12px}.card{background:white;padding:15px;margin-bottom:12px;border-radius:10px;box-shadow:0 2px 7px #0001}h2{color:#073b75;font-size:20px;margin:0 0 12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#edf3fb;padding:12px;border-radius:8px}.stat small{display:block;color:#555;margin-bottom:6px}.stat strong{font-size:20px}form{display:grid;gap:10px}label{display:grid;gap:5px;font-weight:bold;font-size:14px}input,select{padding:10px;border:1px solid #ccd3df;border-radius:7px;font:inherit;width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:8px;border-bottom:1px solid #ddd}th{background:#f4f6f9}.red{background:#b42318}.green{background:#137547}.muted{color:#666}.empty{text-align:center;padding:14px;color:#666}.notice{display:none;background:#fff0bf;padding:10px;border-radius:8px;margin-bottom:10px}footer{text-align:center;color:#666;padding:18px;font-size:13px}@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}.row{grid-template-columns:repeat(3,1fr)}}@media print{header,nav,footer,.noprint{display:none!important}body{background:white}.card{box-shadow:none}}
</style></head><body>
<header><h1>BHARAT TELECOM</h1><p>Dhaurahara | Mobile &amp; Electronics</p><button id="lang" onclick="toggleLang()">हिंदी / English</button></header>
<nav id="nav"></nav><main><div id="notice" class="notice"></div><div id="app"></div></main><footer>Bharat Telecom Dhaurahara · Mobile &amp; Electronics</footer>
<script>
const K='bharatTelecomManagerV3';
let data;try{data=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
if(!data||!Array.isArray(data.items)||!Array.isArray(data.customers)||!Array.isArray(data.sales))data={items:[],customers:[],sales:[]};
let lang='hi',tab='home';
const W={
hi:{home:'डैशबोर्ड',stock:'स्टॉक',sale:'बिलिंग / बिक्री',customers:'ग्राहक',history:'बिक्री रिकॉर्ड',summary:'दुकान का सारांश',products:'प्रोडक्ट',units:'कुल पीस',revenue:'कुल बिक्री',profit:'अनुमानित लाभ',add:'स्टॉक में सामान जोड़ें',name:'प्रोडक्ट का नाम',sku:'मॉडल / कोड',buy:'खरीद कीमत ₹',price:'बिक्री कीमत ₹',qty:'मात्रा',save:'सेव करें',list:'स्टॉक सूची',actions:'काम',delete:'हटाएँ',bill:'बिल बनाएँ',customer:'ग्राहक का नाम',phone:'मोबाइल नंबर',choose:'प्रोडक्ट चुनें',sellqty:'बिक्री मात्रा',payment:'भुगतान',cash:'नकद',upi:'UPI',other:'अन्य',customersList:'ग्राहकों की सूची',addCustomer:'ग्राहक जोड़ें',date:'तारीख',total:'कुल',empty:'अभी कोई रिकॉर्ड नहीं है।',emptyStock:'पहले स्टॉक में सामान जोड़ें।',low:'कम स्टॉक',print:'बिल प्रिंट',search:'नाम/मोबाइल खोजें',required:'ज़रूरी जानकारी भरें।',notEnough:'इतना स्टॉक उपलब्ध नहीं है।',saved:'सेव हो गया।',sold:'बिक्री सेव हो गई।',confirm:'क्या हटाना है?',walkin:'वॉक-इन ग्राहक'},
en:{home:'Dashboard',stock:'Stock',sale:'Sales / Billing',customers:'Customers',history:'Sales History',summary:'Shop Summary',products:'Products',units:'Total Units',revenue:'Total Sales',profit:'Estimated Profit',add:'Add Stock Item',name:'Product Name',sku:'Model / Code',buy:'Cost Price ₹',price:'Selling Price ₹',qty:'Quantity',save:'Save',list:'Stock List',actions:'Actions',delete:'Delete',bill:'Create Bill',customer:'Customer Name',phone:'Mobile Number',choose:'Choose Product',sellqty:'Quantity Sold',payment:'Payment',cash:'Cash',upi:'UPI',other:'Other',customersList:'Customer List',addCustomer:'Add Customer',date:'Date',total:'Total',empty:'No records yet.',emptyStock:'Add stock first.',low:'Low Stock',print:'Print Bill',search:'Search name/mobile',required:'Fill required fields.',notEnough:'Not enough stock available.',saved:'Saved.',sold:'Sale saved.',confirm:'Delete this item?',walkin:'Walk-in Customer'}
};
const t=k=>W[lang][k]||k, money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function save(){localStorage.setItem(K,JSON.stringify(data))}
function note(s){let n=document.getElementById('notice');n.textContent=s;n.style.display='block';setTimeout(()=>n.style.display='none',3000)}
function toggleLang(){lang=lang==='hi'?'en':'hi';render()}
function go(s){tab=s;render()}
function nav(){document.getElementById('nav').innerHTML=['home','stock','sale','customers','history'].map(k=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${t(k)}</button>`).join('')}
function home(){let units=data.items.reduce((a,x)=>a+ +x.qty,0),rev=data.sales.reduce((a,x)=>a+ +x.total,0),p=data.sales.reduce((a,x)=>a+ +x.profit,0);return `<section class="card"><h2>${t('summary')}</h2><div class="stats"><div class="stat"><small>${t('products')}</small><strong>${data.items.length}</strong></div><div class="stat"><small>${t('units')}</small><strong>${units}</strong></div><div class="stat"><small>${t('revenue')}</small><strong>${money(rev)}</strong></div><div class="stat"><small>${t('profit')}</small><strong>${money(p)}</strong></div></div></section><section class="card"><h2>${t('low')}</h2>${data.items.filter(x=>x.qty<=3).map(x=>`<p>${esc(x.name)} — ${x.qty}</p>`).join('')||`<p class="muted">${t('empty')}</p>`}</section>`}
function stock(){return `<section class="card"><h2>${t('add')}</h2><form onsubmit="addProduct(event)"><label>${t('name')}<input name="name" required></label><label>${t('sku')}<input name="sku"></label><div class="row"><label>${t('buy')}<input name="buy" type="number" min="0" step=".01" required></label><label>${t('price')}<input name="price" type="number" min="0" step=".01" required></label><label>${t('qty')}<input name="qty" type="number" min="0" step="1" required></label></div><button>${t('save')}</button></form></section><section class="card"><h2>${t('list')}</h2>${data.items.length?`<div class="wrap"><table><tr><th>${t('name')}</th><th>${t('buy')}</th><th>${t('price')}</th><th>${t('qty')}</th><th>${t('actions')}</th></tr>${data.items.map(x=>`<tr><td>${esc(x.name)}<br><small>${esc(x.sku)}</small></td><td>${money(x.buy)}</td><td>${money(x.price)}</td><td>${x.qty}</td><td><button class="red" onclick="delProduct('${x.id}')">${t('delete')}</button></td></tr>`).join('')}</table></div>`:`<p class="empty">${t('emptyStock')}</p>`}</section>`}
function sale(){let opts=data.items.filter(x=>x.qty>0).map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(x.price)} (qty ${x.qty})</option>`).join('');return `<section class="card"><h2>${t('bill')}</h2>${opts?`<form onsubmit="makeSale(event)"><label>${t('customer')}<input name="customer" placeholder="${t('walkin')}"></label><label>${t('phone')}<input name="phone" inputmode="tel"></label><label>${t('choose')}<select name="item" required>${opts}</select></label><label>${t('sellqty')}<input name="qty" type="number" min="1" value="1" required></label><label>${t('payment')}<select name="payment"><option>${t('cash')}</option><option>UPI</option><option>${t('other')}</option></select></label><button class="green">${t('save')}</button></form>`:`<p>${t('emptyStock')}</p>`}</section>`}
function customerRows(arr){return arr.length?`<div class="wrap"><table><tr><th>${t('name')}</th><th>${t('phone')}</th><th>${t('actions')}</th></tr>${arr.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td><button class="red" onclick="delCustomer('${c.id}')">${t('delete')}</button></td></tr>`).join('')}</table></div>`:`<p class="empty">${t('empty')}</p>`}
function customers(){return `<section class="card"><h2>${t('addCustomer')}</h2><form onsubmit="addCustomer(event)"><label>${t('name')}<input name="name" required></label><label>${t('phone')}<input name="phone" inputmode="tel"></label><button>${t('save')}</button></form></section><section class="card"><h2>${t('customersList')}</h2><label>${t('search')}<input id="q" oninput="filterCustomers()"></label><div id="rows">${customerRows(data.customers)}</div></section>`}
function filterCustomers(){let q=(document.getElementById('q').value||'').toLowerCase();document.getElementById('rows').innerHTML=customerRows(data.customers.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(q)))}
function history(){return `<section class="card"><h2>${t('history')}</h2>${data.sales.length?`<div class="wrap"><table><tr><th>${t('date')}</th><th>${t('customer')}</th><th>${t('name')}</th><th>${t('qty')}</th><th>${t('payment')}</th><th>${t('total')}</th><th class="noprint">${t('actions')}</th></tr>${data.sales.slice().reverse().map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(s.customer||t('walkin'))}<br>${esc(s.phone)}</td><td>${esc(s.product)}</td><td>${s.qty}</td><td>${esc(s.payment)}</td><td>${money(s.total)}</td><td class="noprint"><button onclick="printBill('${s.id}')">${t('print')}</button></td></tr>`).join('')}</table></div>`:`<p class="empty">${t('empty')}</p>`}</section>`}
function render(){nav();document.getElementById('app').innerHTML=tab==='home'?home():tab==='stock'?stock():tab==='sale'?sale():tab==='customers'?customers():history()}
function addProduct(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim();if(!name){note(t('required'));return}data.items.push({id:uid(),name,sku:String(f.get('sku')||''),buy:+f.get('buy'),price:+f.get('price'),qty:+f.get('qty')});save();render();note(t('saved'))}
function delProduct(id){if(!confirm(t('confirm')))return;data.items=data.items.filter(x=>x.id!==id);save();render()}
function addCustomer(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim();if(!name){note(t('required'));return}data.customers.push({id:uid(),name,phone:String(f.get('phone')||'')});save();render();note(t('saved'))}
function delCustomer(id){if(!confirm(t('confirm')))return;data.customers=data.customers.filter(x=>x.id!==id);save();render()}
function makeSale(e){e.preventDefault();let f=new FormData(e.target),x=data.items.find(i=>i.id===f.get('item')),qty=+f.get('qty');if(!x||qty<1){note(t('required'));return}if(qty>x.qty){note(t('notEnough'));return}let customer=String(f.get('customer')||'').trim(),phone=String(f.get('phone')||'').trim(),s={id:uid(),date:new Date().toLocaleString('en-IN'),customer,phone,product:x.name,qty,total:qty*x.price,profit:qty*(x.price-x.buy),price:x.price,payment:String(f.get('payment'))};x.qty-=qty;data.sales.push(s);if(customer&&!data.customers.some(c=>c.name.toLowerCase()===customer.toLowerCase()&&c.phone===phone))data.customers.push({id:uid(),name:customer,phone});save();render();note(t('sold'))}
function printBill(id){let s=data.sales.find(x=>x.id===id);if(!s)return;let w=window.open('','_blank');if(!w){note('Allow pop-ups to print bill');return}w.document.write(`<html><meta charset="utf-8"><title>Bill</title><body style="font-family:Arial;padding:20px"><h1 style="text-align:center">BHARAT TELECOM</h1><p>Dhaurahara | Mobile & Electronics</p><hr><p>Bill: ${esc(s.id)}<br>Date: ${esc(s.date)}<br>Customer: ${esc(s.customer||'Walk-in Customer')}<br>Mobile: ${esc(s.phone)}</p><table border="1" cellpadding="8" style="border-collapse:collapse;width:100%"><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr><tr><td>${esc(s.product)}</td><td>${s.qty}</td><td>${money(s.price)}</td><td>${money(s.total)}</td></tr></table><h3 style="text-align:right">Grand Total: ${money(s.total)}</h3><p>Payment: ${esc(s.payment)}</p><p>Thank you!</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
render();
</script></body></html>
